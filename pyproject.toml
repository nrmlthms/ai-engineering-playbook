[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-engineer-handbook"
version = "0.1.0"
description = "Production-grade AI engineering — concepts + code"
requires-python = ">=3.12"
dependencies = [
    # LLM SDKs
    "anthropic>=0.100.0",
    "openai>=2.36.0",
    "tiktoken>=0.12.0",
    # Web framework
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "granian>=2.1.0",
    # HTTP client
    "httpx>=0.28.1",
    "tenacity>=9.1.0",
    # Validation & config
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "anyio>=4.9.0",
    # Auth
    "PyJWT>=2.10.0",
    # Observability
    "structlog>=25.1.0",
    # Data
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
rag = [
    "chromadb>=1.5.9",
    "sentence-transformers>=5.4.1",
    "langchain-core>=1.3.3",
]
eval = [
    "deepeval>=4.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
obs = [
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp>=1.41.1",
    "prometheus-client>=0.25.0",
]
dev = [
    "ruff>=0.15.12",
    "mypy>=2.0.0",
    "ipykernel>=7.2.0",
    "rich>=15.0.0",
    "locust>=2.32.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "stage-01-python-production-apis/tests",
    "stage-02-llm-fundamentals/tests",
    "stage-03-prompt-engineering/tests",
    "stage-04-rag-knowledge-grounding/tests",
    "stage-05-agentic-orchestration/tests",
    "stage-06-production-agents/tests",
    "stage-07-evaluation-reliability/tests",
    "stage-08-multimodal-data/tests",
    "stage-09-deployment-observability/tests",
    "stage-10-security-guardrails/tests",
]
